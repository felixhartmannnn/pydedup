[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydedup"
version = "0.1.0"
requires-python = ">=3.11"
description = "Find duplicate Python source blocks across files."
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/felixhartmannnn/pydedup"

[project.scripts]
pydedup = "pydedup.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pydedup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
